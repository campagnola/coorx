name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglx-mesa0

    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        # test_image.ipynb compares rendered figures pixel by pixel, so matplotlib is
        # pinned: its layout metrics shift between releases, which moves every plot
        # element a little and changes the tight-bbox canvas size. Re-record the
        # notebook's outputs whenever this pin moves.
        pip install pytest numpy scipy vispy pyqtgraph itk pyqt5 nbformat nbdime nbclient Pillow ipykernel matplotlib==3.10.7
        python -m ipykernel install --user

    - name: Run tests
      run: |
        python -m pytest
